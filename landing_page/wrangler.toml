name               = "qb-landing"
compatibility_date = "2024-09-23"
main               = "_worker.js"

[assets]
directory = "."
binding   = "ASSETS"

# D1 database binding
# After creating the database: npx wrangler d1 create qb-beta
# Copy the database_id from the output into the field below.
[[d1_databases]]
binding       = "DB"
database_name = "qb-beta"
database_id   = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
