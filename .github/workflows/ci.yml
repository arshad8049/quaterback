name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Also run real-agent / Docker integration tests'
        type: boolean
        default: false

jobs:
  unit:
    # Deterministic regression gate. No secrets, no model, no network services.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root + layer packages
        run: |
          npm ci
          for d in intent agent context verify memory bench; do (cd "$d" && npm ci); done
      - name: Unit tests
        run: npm test

  integration:
    # Sandbox integration suite (QB-02): real Docker Engine on the supported
    # platform, no model credentials. Runs on every push and on demand.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.integration)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root + layer packages
        run: |
          npm ci
          for d in intent agent context verify memory bench; do (cd "$d" && npm ci); done
      - name: Environment
        run: docker version; uname -a; git --version
      - name: Integration tests
        run: npm run test:integration
