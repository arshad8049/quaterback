name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Also run real-agent / Docker integration tests'
        type: boolean
        default: false

jobs:
  unit:
    # Deterministic regression gate. No secrets, no model, no network services.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root + layer packages
        run: |
          npm ci
          for d in intent agent context verify memory bench; do (cd "$d" && npm ci); done
      - name: Unit tests
        run: npm test

  integration:
    # Opt-in only. Records model/CLI versions; needs Docker and agent credentials.
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root + layer packages
        run: |
          npm ci
          for d in intent agent context verify memory bench; do (cd "$d" && npm ci); done
      - name: Integration tests
        run: npm run test:integration
