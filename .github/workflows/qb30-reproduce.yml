name: qb30-reproduce

# QB-30: does a fresh GitHub-hosted Ubuntu 24.04 x86_64 VM (4 vCPU, 16 GB) reproduce the frozen
# dev set? Builds the 5 pinned task repositories, re-qualifies all 30 frozen tasks with the real
# grader in Docker (the reference passes, every incorrect implementation fails), and compares each
# fresh result with the frozen spec (scripts/qb30-reproduce-check.js).
# KAN-74: the set is dev-r2 (frozen in KAN-71). v1 records the earlier grader, so the current
# grader cannot reproduce it; `node scripts/qb30-reproduce-check.js --set dev` still checks it. No model, no agent, no
# secrets, no spend. Results are published as annotations (readable without a token) and as the
# `qb30-reproduce` artifact.

on:
  push:
    paths: [.github/workflows/qb30-reproduce.yml, scripts/qb30-reproduce-check.js, bench/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /; free -g
      - name: Install
        run: |
          npm ci
          [ -f bench/package-lock.json ] && npm ci --prefix bench || true
      - name: Build the 5 pinned task repositories
        run: |
          set -o pipefail   # KAN-76: a failed build must fail the step, not take tee's status
          node bench/repos.js build all 2>&1 | tee build.log
      - name: Re-qualify all 30 frozen dev-r2 tasks with the real grader (fresh drafts only)
        run: |
          rm -f bench/dev-r2/specs/*.draft.json      # never compare against the committed drafts
          : > qualify.log
          for id in $(node -e "console.log(Object.keys(require('./bench/dev-r2/specs.lock.json').specs).sort().join(' '))"); do
            [ "$id" = AV-01 ] && { echo "== $id skipped (KAN-76 CONTROL ONLY: its draft must be MISSING)" | tee -a qualify.log; continue; }
            echo "== $id" | tee -a qualify.log
            node bench/curate.js qualify "$id" --set dev-r2 >> qualify.log 2>&1 || echo "   qualify FAILED (exit $?)" | tee -a qualify.log
          done
      - name: Compare with the frozen dev-r2 specs
        run: |
          set -o pipefail   # KAN-76: a mismatch must fail the step, not take tee's status
          node scripts/qb30-reproduce-check.js --set dev-r2 | tee compare.log
      - name: Publish results as annotations
        if: always()
        run: |
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'; }
          [ -f compare.log ] && echo "::notice title=QB-30 frozen dev set (dev-r2) on a fresh VM::$( { node --version; tail -1 compare.log; echo; cat compare.log; } | enc)"
          [ -f build.log ] && echo "::notice title=Task repositories built::$(tail -20 build.log | enc)"
          grep -q FAILED qualify.log 2>/dev/null && echo "::notice title=Qualify failures::$(grep -B1 -A8 FAILED qualify.log | head -60 | enc)"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qb30-reproduce
          path: |
            build.log
            qualify.log
            compare.log
            bench/dev-r2/specs/*.draft.json
          retention-days: 30
